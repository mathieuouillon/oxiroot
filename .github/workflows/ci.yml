name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / lint / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test (plotting feature combos)
        # `cargo test --workspace` exercises the plot crate's tests with its
        # default features, so it skips the `fit`-gated cases. Run those: the
        # plot crate with `fit` (the Model-overlay test) and the facade with
        # `plot,fit` (the high-level `tests/plot.rs`, which only compiles under
        # the `plot` feature).
        run: |
          cargo test -p oxiroot-plot --features fit
          cargo test -p oxiroot --features plot,fit

      - name: Run examples (smoke)
        # The showcase examples drive the method-based read/write API end to end —
        # the RootFile builder (multi-object, subdirectory, append), read_root_in,
        # Tree/Ntuple::write_root, and nested RNTuple round-trips — so a regression
        # in any of them fails CI (each asserts against its own written output).
        run: |
          cargo run -q -p oxiroot --example analysis
          cargo run -q -p oxiroot --example tree
          cargo run -q -p oxiroot --example rntuple_nested
          cargo run -q -p oxiroot --example plot --features plot,fit

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Each crate with no features, and with each feature alone
        # Catches a feature that only compiles alongside another one. Features
        # must add API, never change it, so every combination has to build.
        run: cargo hack check --workspace --each-feature --no-dev-deps

      - name: Clippy with all features
        # The only job that compiles the `http` and `xrootd` remote-read paths.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test with all features
        run: cargo test --workspace --all-features

      - name: Test the facade with no default features
        run: cargo test -p oxiroot --no-default-features

      - name: oxiroot-plot doc examples with no default features
        # Examples that draw oxiroot-hist types are gated on the `hist` feature
        # (`# #[cfg(feature = "hist")] { … # }`); this keeps the rest compiling
        # and running in an SVG/PDF-only build.
        run: cargo test -p oxiroot-plot --no-default-features --doc

      - name: Histogram-only builds do not compile the formula engine
        # TF1/TF2/TF3 live in oxiroot-hist-func so that oxiroot-hist (and
        # oxiroot-plot without `fit`) stay free of oxiroot-formula.
        run: |
          set -euo pipefail
          hist=$(cargo tree -p oxiroot-hist -e normal)
          plot=$(cargo tree -p oxiroot-plot -e normal)
          if grep -E 'oxiroot-(formula|hist-func)' <<<"$hist"; then
            echo "oxiroot-hist must not depend on the formula engine"; exit 1
          fi
          if grep oxiroot-formula <<<"$plot"; then
            echo "oxiroot-plot (default features) must not depend on the formula engine"; exit 1
          fi

  msrv:
    name: minimum Rust version (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the workspace's declared rust-version
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --all-features

  docs:
    name: API docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the docs, denying broken links
        run: cargo doc --no-deps --all-features --workspace

  package:
    name: package (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Package and verify every publishable crate
        # Builds each crate from its packaged sources, resolving the others
        # through a temporary local registry, so a missing file, a git
        # dependency, or a dependency without a version fails here instead of
        # at release.
        run: cargo package --workspace

  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build fuzz targets
        working-directory: fuzz
        # Compile-only: a real campaign runs out of band, but this keeps the
        # harness from rotting against API changes.
        run: cargo +nightly fuzz build

  interop-uproot:
    name: interop (uproot)
    # Round-trip against uproot (the Python ROOT-IO library): Rust writes a
    # histogram + RNTuple + TTree + a RootFile-built multi-object/subdirectory
    # file + an appended file, all of which uproot reads; uproot writes a
    # histogram + TTree + a subdirectory file that Rust reads (the subdirectory
    # via read_root_in). (uproot's TTree writer can't emit std::vector, so that
    # branch is exercised only in the ROOT C++ job.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uproot
        run: pip install uproot numpy awkward

      - name: Build interop driver
        run: cargo build -p oxiroot --example interop

      - name: Rust writes → uproot reads
        run: |
          mkdir -p /tmp/interop
          cargo run -q -p oxiroot --example interop -- write /tmp/interop
          python scripts/interop_uproot.py read /tmp/interop

      - name: uproot writes → Rust reads
        run: |
          python scripts/interop_uproot.py write /tmp/interop
          cargo run -q -p oxiroot --example interop -- read /tmp/interop

  interop-root:
    name: interop (ROOT C++)
    # Round-trip against an official ROOT build: ROOT C++ writes a histogram +
    # RNTuple + TTree (incl. a std::vector branch) + a subdirectory file that
    # Rust reads (the subdirectory via read_root_in), and Rust writes a histogram
    # + RNTuple + TTree + a RootFile-built multi-object/subdirectory file + an
    # appended file that ROOT C++ reads. The TTree covers scalar, fixed array,
    # string, jagged, and std::vector branches both ways. Pin the image tag if
    # upstream RNTuple format drift is a concern.
    runs-on: ubuntu-latest
    container: rootproject/root:latest
    # The container runs as root; align HOME with root's actual home so rustup
    # doesn't mistake the GitHub-set HOME for a sudo invocation, and so the
    # toolchain it installs is found by later steps. Applies to every step.
    #
    # That HOME also reaches the host-side `docker exec` the runner uses to run
    # each step, so its docker CLI tries to read root's ~/.docker/config.json
    # (unreadable by the runner user) and prints a benign "permission denied"
    # warning. Point DOCKER_CONFIG at an empty dir so docker finds no config and
    # stays quiet — it doesn't need one here (the image is already pulled).
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build interop driver
        run: cargo build -p oxiroot --example interop

      - name: Build ROOT C++ oracle
        run: c++ $(root-config --cflags) scripts/interop_root.cpp $(root-config --libs) -lROOTNTuple -o /tmp/interop_root

      - name: ROOT C++ writes → Rust reads
        run: |
          mkdir -p /tmp/interop
          /tmp/interop_root write /tmp/interop
          cargo run -q -p oxiroot --example interop -- read /tmp/interop

      - name: Rust writes → ROOT C++ reads
        run: |
          cargo run -q -p oxiroot --example interop -- write /tmp/interop
          /tmp/interop_root read /tmp/interop
