[package]
name = "oxiroot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust IO for the CERN ROOT file format (RNTuple + classic histograms)"

[dependencies]
# `stat` and `formula`: statistics and formula errors convert into
# `oxiroot::Error`, so `?` works across the whole API.
oxiroot-io-core = { workspace = true, features = ["stat", "formula"] }
oxiroot-compress = { workspace = true }
oxiroot-rntuple = { workspace = true }
oxiroot-hist = { workspace = true }
oxiroot-hist-func = { workspace = true }
oxiroot-linalg = { workspace = true }
oxiroot-tree = { workspace = true }
oxiroot-stat = { workspace = true }
oxiroot-particle = { workspace = true }
oxiroot-fit = { workspace = true, optional = true }
oxiroot-plot = { workspace = true, optional = true }

[features]
# Batteries-included: the facade turns on fitting (Minuit2 plus the argmin
# Nelder–Mead backend), plotting, and the mmap read path by default. Opt out of
# the extra dependencies with `default-features = false`, then re-enable what you
# need. `rayon` is opt-in, so a library never spawns threads its user did not ask
# for.
default = ["fit", "plot", "mmap", "argmin"]
# Enable the memory-mapped read path (`FileReader::open_mmap`).
mmap = ["oxiroot-io-core/mmap"]
# Enable remote reads over HTTP(S) byte-range requests (`FileReader::open_url`). Opt
# in — off by default so the standard build pulls no networking/TLS stack.
http = ["oxiroot-io-core/http"]
# Enable remote reads over the XRootD `root://` protocol (`FileReader::open_url`).
# Opt-in; pure `std::net` (unix auth), so it adds no dependencies.
xrootd = ["oxiroot-io-core/xrootd"]
# Enable the data-parallel helpers: the histogram fill (`hist::fill_par`) and
# the parallel TTree reads (`TreeReader::read_branch_par` and friends).
rayon = ["oxiroot-hist/rayon", "oxiroot-tree/rayon"]
# Enable curve fitting (`oxiroot::fit`) via Minuit2: the `oxiroot-fit` engine,
# the `FitData` impls for `TH1`/`TGraph` so `h.fit(&model)` works, and
# `TF1::to_model`. When the `plot` feature is also on, this lights up
# `Axes::model` (fit-curve overlay).
fit = ["oxiroot-hist/fit", "oxiroot-hist-func/fit", "dep:oxiroot-fit", "oxiroot-plot?/fit"]
# Also build the gradient-free Nelder–Mead (`argmin`) minimizer backend.
argmin = ["fit", "oxiroot-fit/argmin"]
# Enable plotting (`oxiroot::plot`): render TH1/TH2/TGraph/TProfile to SVG/PNG
# with a matplotlib-like API and mplhep style. Pulls tiny-skia, ab_glyph, and
# the ReX TeX engine (vendored as oxiroot-rex) for `$…$` math labels.
plot = ["dep:oxiroot-plot"]

# Build docs.rs with every feature so fitting, the argmin backend, rayon, and
# mmap all appear in the rendered API reference.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
