[package]
name = "oxiroot-plot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust plotting for ROOT histograms and graphs — matplotlib-like API, mplhep style, SVG/PNG/PDF"

[dependencies]
# Draw the histogram and graph types directly (the `hist` feature).
oxiroot-hist = { workspace = true, optional = true }
# With `hist` (which already brings it in through oxiroot-hist): the shared
# `oxiroot::Error` that plotting errors convert into, so `?` works in code that
# reads files and saves figures.
oxiroot-io-core = { workspace = true, optional = true }
# Optional: overlay a fitted `Model` curve with `Axes::model` (the `fit` feature).
oxiroot-fit = { workspace = true, optional = true }
# CPU anti-aliased 2D rasterizer (resvg's own renderer); re-exports the pure-Rust
# `png` crate, so PNG encoding needs no extra dependency. Pure, safe Rust. Only
# PNG output uses it (the `png` feature).
tiny-skia = { version = "0.12", optional = true }
# Pure-Rust glyph outlines + rasterization for axis/tick/title text. No system
# fonts: the DejaVu Sans faces are bundled and loaded from memory.
ab_glyph = "0.2"
# ReX — a pure-Rust TeX *math* layout engine — typesets `$…$` spans in labels.
# It is vendored in-tree as oxiroot-rex (ReX is not on crates.io), with only its
# ttf-parser font backend; a custom backend turns ReX's draw calls into the
# crate's own DrawCommand IR. Only `$…$` math uses it (the `math` feature).
oxiroot-rex = { workspace = true, optional = true }
# Glyph outline extraction for the math font, which is parsed in every build.
# Shared with oxiroot-rex, whose font backend exposes ttf-parser types.
ttf-parser = { workspace = true }

[features]
# SVG and PDF output need no feature; PNG output and TeX math are on by default.
# An SVG/PDF-only build (`default-features = false`) drops the rasterizer and
# the TeX engine, and lays `$…$` labels out as plain text.
default = ["hist", "png", "math"]
# Implement the plot data traits for oxiroot's TH1/TH2/TProfile/TGraph.
hist = ["dep:oxiroot-hist", "dep:oxiroot-io-core"]
# PNG output, through the tiny-skia rasterizer.
png = ["dep:tiny-skia"]
# Typeset `$…$` label spans as TeX math, through the ReX engine.
math = ["dep:oxiroot-rex"]
# Overlay a fitted `oxiroot_fit::Model` curve via `Axes::model`. (The general
# `Axes::function` closure overlay is always available, with no extra deps.)
fit = ["dep:oxiroot-fit"]

[dev-dependencies]
# The tests plot histograms and graphs.
oxiroot-hist = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
