[package]
name = "oxiroot-io-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core ROOT (TFile) container and buffer primitives"

[dependencies]
oxiroot-compress = { workspace = true }
bytes = { workspace = true }
memmap2 = { version = "0.9", optional = true }
ureq = { workspace = true, optional = true }

[features]
# Opt-in memory-mapped read path (`RFile::open_mmap`). Off by default so the
# default build stays pure safe Rust with no extra dependencies.
mmap = ["dep:memmap2"]
# Opt-in remote reads over HTTP(S) byte-range requests (`RFile::open_url`). Off
# by default so the default build pulls no networking/TLS stack.
http = ["dep:ureq"]

# Render every read path (mmap, http) in the docs.rs API reference.
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
