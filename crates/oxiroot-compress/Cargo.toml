[package]
name = "oxiroot-compress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["root", "cern", "hep", "zstd", "lz4"]
categories = ["compression", "science"]
description = "ROOT compression block framing and codecs"

[dependencies]
miniz_oxide = "0.9.1"
ruzstd = "0.8.3"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
# Pure-Rust LZMA/XZ (tukaani xz-for-java port). Both directions: `xz` gives the
# decoder, `encoder` the compressor. `optimization` improves the ratio.
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz", "encoder", "optimization"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
