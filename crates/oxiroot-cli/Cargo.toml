[package]
name = "oxiroot-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "oxroot: a command-line inspector for ROOT files (ls / show / dump / stat)"

[[bin]]
name = "oxroot"
path = "src/main.rs"

[dependencies]
oxiroot = { workspace = true }
clap = { workspace = true }

[features]
# Read ROOT files from an `http(s)://` URL via byte-range requests. Off by
# default so the plain `oxroot` binary needs no networking/TLS stack; build with
# `--features http` for remote inspection.
http = ["oxiroot/http"]
# Read ROOT files from a `root://` (XRootD) URL. Pure std::net (unix auth), no
# extra dependencies; build with `--features xrootd`.
xrootd = ["oxiroot/xrootd"]

[lints]
workspace = true
