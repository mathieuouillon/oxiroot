[package]
name = "oxiroot-hist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Classic ROOT histograms, profiles and graphs (TH1/TH2/TH3/TProfile/TGraph…) read/write"

[dependencies]
oxiroot-io-core = { workspace = true }
oxiroot-stat = { workspace = true }
rayon = { version = "1", optional = true }
oxiroot-fit = { workspace = true, optional = true }

[dev-dependencies]
# Collections and files in the tests hold matrices next to histograms.
oxiroot-linalg = { workspace = true }

[features]
# Opt-in data-parallel fill helper (`fill_par`). Off by default so the default
# build stays pure std with no extra dependencies; the `ThreadedHist`
# accumulator (std::thread based) is always available.
rayon = ["dep:rayon"]
# Opt-in fitting: implements `FitData` for `TH1`/`TGraph` (so `h.fit(&model)`
# works) and re-exports the fitting types from `oxiroot-fit`, which carries the
# Minuit2 minimizer. Off by default to keep the core dependency-light.
# (`TF1::to_model` is behind the `fit` feature of `oxiroot-hist-func`.)
fit = ["dep:oxiroot-fit"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
