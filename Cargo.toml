[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/mathieuouillon/oxiroot"

[workspace.lints.rust]
# Pure-safe-Rust library: the only `unsafe` is the feature-gated mmap in
# oxiroot-io-core (scoped `#[allow]` + SAFETY note). Deny keeps it that way.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Internal crates. `version` must match `workspace.package.version` above: a
# published crate's dependencies need one (`cargo publish` rejects bare paths).
oxiroot-io-core = { path = "crates/oxiroot-io-core", version = "0.0.1" }
oxiroot-compress = { path = "crates/oxiroot-compress", version = "0.0.1" }
oxiroot-linalg = { path = "crates/oxiroot-linalg", version = "0.0.1" }
oxiroot-rntuple = { path = "crates/oxiroot-rntuple", version = "0.0.1" }
oxiroot-hist = { path = "crates/oxiroot-hist", version = "0.0.1" }
oxiroot-hist-func = { path = "crates/oxiroot-hist-func", version = "0.0.1" }
oxiroot-tree = { path = "crates/oxiroot-tree", version = "0.0.1" }
oxiroot-stat = { path = "crates/oxiroot-stat", version = "0.0.1" }
oxiroot-particle = { path = "crates/oxiroot-particle", version = "0.0.1" }
oxiroot-formula = { path = "crates/oxiroot-formula", version = "0.0.1" }
oxiroot-fit = { path = "crates/oxiroot-fit", version = "0.0.1" }
oxiroot-plot = { path = "crates/oxiroot-plot", version = "0.0.1" }
oxiroot-rex = { path = "crates/oxiroot-rex", version = "0.0.1" }
# The facade's batteries-included defaults are for applications; the in-repo
# consumer (the CLI) opts in to what it needs. Default features must be turned
# off here: a member's own `default-features = false` is ignored for an
# inherited dependency.
oxiroot = { path = "crates/oxiroot", version = "0.0.1", default-features = false }
# `oxiroot_rex::font::backend::ttf_parser::TtfMathFont` exposes `ttf_parser`
# types (`Face`, `GlyphId`, `cff::Matrix`), so oxiroot-plot and oxiroot-rex must
# resolve the same version.
ttf-parser = "0.25"
minuit2 = "0.5"
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", features = ["vec"] }
bytes = "1"
# Pure-Rust blocking HTTP client (rustls, no OpenSSL), for the optional `http`
# remote-read feature. `default-features = false` drops gzip transfer decoding,
# which would break byte-range semantics on a compressed response.
ureq = { version = "3", default-features = false, features = ["rustls"] }
proptest = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
