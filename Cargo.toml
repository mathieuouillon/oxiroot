[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/mathieuouillon/oxiroot"

[workspace.lints.rust]
# Pure-safe-Rust library: the only `unsafe` is the feature-gated mmap in
# oxiroot-io-core (scoped `#[allow]` + SAFETY note). Deny keeps it that way.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
oxiroot-io-core = { path = "crates/oxiroot-io-core" }
oxiroot-compress = { path = "crates/oxiroot-compress" }
oxiroot-linalg = { path = "crates/oxiroot-linalg" }
oxiroot-rntuple = { path = "crates/oxiroot-rntuple" }
oxiroot-hist = { path = "crates/oxiroot-hist" }
oxiroot-tree = { path = "crates/oxiroot-tree" }
oxiroot-stat = { path = "crates/oxiroot-stat" }
oxiroot-particle = { path = "crates/oxiroot-particle" }
oxiroot-formula = { path = "crates/oxiroot-formula" }
oxiroot-fit = { path = "crates/oxiroot-fit" }
oxiroot-plot = { path = "crates/oxiroot-plot" }
oxiroot = { path = "crates/oxiroot" }
minuit2 = "0.5"
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", features = ["vec"] }
bytes = "1"
# Pure-Rust blocking HTTP client (rustls, no OpenSSL), for the optional `http`
# remote-read feature. `default-features = false` drops gzip transfer decoding,
# which would break byte-range semantics on a compressed response.
ureq = { version = "3", default-features = false, features = ["rustls"] }
proptest = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
